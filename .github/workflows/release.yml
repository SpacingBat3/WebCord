name: Publish release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    strategy:
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            arch: x64,arm64
          - name: Windows
            runner: windows-latest
            arch: x64,arm64
          - name: macOS
            runner: macos-latest
            arch: x64,arm64 #,universal

    name: ${{ matrix.name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      WEBCORD_BUILD: ${{ contains(github.ref_name, '-') && 'RELEASE' || 'DEVEL' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.name == 'Windows' && '24.x' || 'latest' }}
          cache: npm

      - name: Install dependencies (NPM)
        run: npm ci

      - name: TSC cache
        uses: actions/cache@v6
        with:
          key: tsc
          path: |
            app
            cache/tsc.json

      - name: Publish distributables (${{ matrix.arch}})
        uses: nick-fields/retry@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          retry_on: error
          max_attempts: ${{ matrix.name == 'Windows' && 6 || 3 }}
          timeout_minutes: ${{ matrix.name == 'Windows' && 15 || 10 }}
          command: npm run publish -- -a ${{ matrix.arch }}
